<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj4KICA8cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgcng9IjQ0IiBmaWxsPSIjMEQxMTE3Ii8+CiAgPHBhdGggZD0iTTcyIDY4TDExNCAxMDBMNzIgMTMyIiBzdHJva2U9IiMwMEM5QTciIHN0cm9rZS13aWR0aD0iMTMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgc3Ryb2tlLW9wYWNpdHk9IjAuMyIvPgogIDxwYXRoIGQ9Ik05NCA2OEwxMzYgMTAwTDk0IDEzMiIgc3Ryb2tlPSIjMDBDOUE3IiBzdHJva2Utd2lkdGg9IjEzIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPC9zdmc+" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLA · Relay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      background: #eaf3de;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 26px;
      color: #3b6d11;
    }
    h1 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #a0a09c; margin-bottom: 1.75rem; }
    input {
      width: 100%;
      background: #fff;
      color: #1a1a18;
      border: 0.5px solid rgba(0,0,0,0.22);
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 0.1em;
    }
    input:focus { outline: none; border-color: #185fa5; }
    button {
      width: 100%;
      background: #1a1a18;
      color: #f8f7f4;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { opacity: 0.85; }
    .error {
      background: #fcebeb;
      color: #a32d2d;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .footer {
      font-size: 11px;
      color: #a0a09c;
      margin-top: 1.75rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="ti ti-qrcode" aria-hidden="true"></i>
    </div>
    <h1><img src="/CLA_Logo_Black.png" alt="Christian Life Assembly" style="height:32px;width:auto;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;" /></h1>
    <p class="sub">Event check-in &amp; follow-up</p>
    <a href="https://relay.logvan.com" target="_blank" rel="noopener"
      style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
             color:rgba(0,201,167,0.8);background:rgba(0,201,167,0.08);
             border:1px solid rgba(0,201,167,0.2);border-radius:100px;
             padding:3px 10px;text-decoration:none;letter-spacing:0.04em;margin-bottom:1.5rem;">
      <svg width="12" height="12" viewBox="0 0 200 200" fill="none">
        <rect width="200" height="200" rx="44" fill="#0D1117"/>
        <path d="M72 68L114 100L72 132" stroke="#00C9A7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3"/>
        <path d="M94 68L136 100L94 132" stroke="#00C9A7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Powered by Relay
    </a>

    <input id="password" type="password" placeholder="Enter password"
      onkeydown="if(event.key==='Enter') login()" autofocus />
    <button onclick="login()">Sign in</button>
    <div class="error" id="error-msg">
      <i class="ti ti-alert-circle" aria-hidden="true"></i> <span id="error-text">Incorrect password. Try again.</span>
    </div>
    <p class="footer">Made with care by Logan VanDyke</p>
  </div>

  <script>
    async function login() {
      const pw = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (r.ok) {
          window.location.href = '/scanner';
        } else {
          const data = await r.json().catch(() => ({}));
          const msg = r.status === 429
            ? (data.error || 'Too many attempts. Try again in 15 minutes.')
            : 'Incorrect password. Try again.';
          document.getElementById('error-text').textContent = msg;
          err.style.display = 'block';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        err.style.display = 'block';
      }
    }
  </script>
</body>
</html>
