<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#0D1117"/>
  <rect width="200" height="200" rx="44" fill="url(#glow)" fill-opacity="0.5"/>

  <!-- Two right-pointing chevrons, stacked vertically and centered -->
  <!-- Back chevron (dimmer) -->
  <path d="M72 68L114 100L72 132"
    stroke="#00C9A7"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.3"
  />
  <!-- Front chevron (bright) -->
  <path d="M94 68L136 100L94 132"
    stroke="#00C9A7"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
