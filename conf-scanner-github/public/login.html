<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f7f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.1);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      background: #eaf3de;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 26px;
      color: #3b6d11;
    }
    h1 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #a0a09c; margin-bottom: 1.75rem; }
    input {
      width: 100%;
      background: #fff;
      color: #1a1a18;
      border: 0.5px solid rgba(0,0,0,0.22);
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 0.1em;
    }
    input:focus { outline: none; border-color: #185fa5; }
    button {
      width: 100%;
      background: #1a1a18;
      color: #f8f7f4;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { opacity: 0.85; }
    .error {
      background: #fcebeb;
      color: #a32d2d;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .footer {
      font-size: 11px;
      color: #a0a09c;
      margin-top: 1.75rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="ti ti-qrcode" aria-hidden="true"></i>
    </div>
    <h1>Relay</h1>
    <p class="sub">Event check-in &amp; follow-up</p>

    <input id="password" type="password" placeholder="Enter password"
      onkeydown="if(event.key==='Enter') login()" autofocus />
    <button onclick="login()">Sign in</button>
    <div class="error" id="error-msg">
      <i class="ti ti-alert-circle" aria-hidden="true"></i> <span id="error-text">Incorrect password. Try again.</span>
    </div>
    <p class="footer">Made with care by Logan VanDyke</p>
  </div>

  <script>
    async function login() {
      const pw = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (r.ok) {
          window.location.href = '/scanner';
        } else {
          const data = await r.json().catch(() => ({}));
          const msg = r.status === 429
            ? (data.error || 'Too many attempts. Try again in 15 minutes.')
            : 'Incorrect password. Try again.';
          document.getElementById('error-text').textContent = msg;
          err.style.display = 'block';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        err.style.display = 'block';
      }
    }
  </script>
</body>
</html>
